- name: test shell and command module
  hosts: local
  connection: local
  tasks:
  - name: test the shell and command module
    command: cat /etc/passwd | grep ec2-user
    register: ec2_user_output

  - name: print the output
    debug: "{{ ec2_user_output }}"

  - name: get the file 
    command: ls -la > /tmp/files.txt
    register: files_output

  - name: files output
    debug:
      msg: "{{ files_output }}"
