- name: print the data types
  hosts: local
  connection: local
  vars:
    first_name: "Suresh" # string
    age: 28 # number
    graduate: true # boolean
    languages: # list
    - english
    - hindi
    more_details: # map/ dict
      email: "suresh@gmail.com"
      height: 5.5 # float

  tasks:
  - name: print the data types
    debug:
      msg: |
         name: {{ first_name }} : {{ first_name | type_debug }}
         age: {{ age }} : : {{ age | type_debug }}
         graduate: {{ graduate }} : : {{ graduate | type_debug }}
         languages: {{ languages }} : : {{ languages | type_debug }}
         more_details: {{ more_details }} : : {{ more_details | type_debug }}
